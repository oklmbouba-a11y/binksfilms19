<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINKSFILMS — LAB / expérience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LA STRUCTURE, EN TROIS ZONES

   1. LE FLUX          langage permanent. La grammaire d'intensité y
                       vit, et seulement là.
   2. LA FICHE         zone de silence. Aucun effet, jamais. C'est la
                       règle qui empêche la grammaire de devenir un
                       thème : elle doit avoir un endroit interdit.
   3. LES SEUILS       l'entrée et le retour. Continus, sans noir.

   Rien ne se répète d'une zone à l'autre. Un futur effet devra
   déclarer dans quelle zone il vit, ou il n'entre pas.
   ============================================================ */
:root{color-scheme:dark;--noir:#0A0A0A;--ivoire:#EDEBE6;--gris:#8E8A84;--gris2:#5C5955;--rouge:#B11226;
  --ligne:rgba(237,235,230,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--noir);overflow:hidden;
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:var(--ivoire);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#medias video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px}

/* ---------- 1. LE FLUX ---------- */
.flux{position:fixed;inset:0;z-index:2;pointer-events:none;transition:opacity .5s ease}
.flux.retire{opacity:0}
.cartel{position:absolute;left:0;right:0;bottom:0;padding:0 28px 34px;
  background:linear-gradient(to top,rgba(6,6,6,.9),rgba(6,6,6,.42) 36%,rgba(6,6,6,0) 78%)}
@media(min-width:900px){.cartel{padding:0 48px 46px}}
.artiste{font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(14px,1.9vw,18px);line-height:1.1}
.titre{font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:clamp(27px,6vw,70px);line-height:1.02;margin-top:2px}
.meta{margin-top:9px;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,235,230,.55);font-variant-numeric:tabular-nums}
.ouvrir{margin-top:20px;pointer-events:auto;background:none;border:0;border-bottom:1px solid var(--ligne);
  font-family:inherit;color:var(--ivoire);font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;padding:0 0 6px;cursor:pointer;transition:border-color .3s}
.ouvrir:hover,.ouvrir:focus-visible{border-color:var(--ivoire);outline:none}
.bobine{position:absolute;top:0;right:0;padding:24px 28px;
  font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--gris);font-variant-numeric:tabular-nums}
@media(min-width:900px){.bobine{padding:28px 48px}}
.marque{position:fixed;top:0;left:0;padding:22px 28px;z-index:3;pointer-events:none}
@media(min-width:900px){.marque{padding:26px 48px}}
.marque b{display:block;font-weight:800;font-stretch:125%;text-transform:uppercase;font-size:12px;letter-spacing:.26em}
.marque i{display:block;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:11px;color:var(--gris);margin-top:1px}

/* ---------- 2. LA FICHE — zone de silence ----------
   Elle monte par-dessus le flux, qui se fige derrière elle. Aucune
   coupe, aucun noir : le plan qu'on regardait devient le fond de sa
   propre fiche. */
.fiche{position:fixed;inset:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .62s cubic-bezier(.16,1,.3,1);
  background:linear-gradient(to bottom,rgba(10,10,10,.55) 0%,rgba(10,10,10,.93) 46%,var(--noir) 78%)}
.fiche.on{transform:none}
.fiche-inner{max-width:1100px;margin:0 auto;padding:44vh 28px 90px}
@media(min-width:900px){.fiche-inner{padding:40vh 48px 120px}}
.retour{background:none;border:0;font-family:inherit;color:var(--gris);cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:0 0 22px;
  display:inline-flex;gap:9px;align-items:center;transition:color .3s}
.retour:hover,.retour:focus-visible{color:var(--ivoire);outline:none}
.f-titre{font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em;
  font-size:clamp(30px,5.4vw,66px);line-height:.96;margin-top:6px}
.f-titre em{font-style:normal;color:#9A958F}
.f-meta{margin-top:32px;display:flex;flex-direction:column;gap:9px;max-width:60ch}
.f-row{display:flex;gap:18px;font-size:14px;color:var(--gris)}
.f-row b{color:var(--ivoire);font-weight:600;min-width:150px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;line-height:1.5;padding-top:2px}
@media(max-width:420px){.f-row b{min-width:112px;max-width:48%}}
.f-note{margin-top:38px;max-width:34em;font-family:'Newsreader',Georgia,serif;font-size:19px;line-height:1.6}

/* ---------- 3. LES SEUILS ---------- */
.porte{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:var(--noir);transition:opacity .7s ease}
.porte.off{opacity:0;pointer-events:none}
.porte button{background:none;border:0;color:var(--ivoire);font-family:inherit;cursor:pointer;
  font-size:12px;font-weight:300;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;padding:18px 24px}
.porte span{display:block;width:62px;height:1px;background:rgba(237,235,230,.5);margin:13px auto 0}
.aide{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 0 13px;z-index:3;
  font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,235,230,.32);
  transition:opacity .8s ease;pointer-events:none}
.aide.off{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="medias"></div>

<div class="marque"><b>Binksfilms</b><i>Les beaux arts du ghetto</i></div>

<div class="flux" id="flux">
  <div class="bobine" id="bobine">01 / 10</div>
  <div class="cartel">
    <p class="artiste" id="artiste"></p>
    <p class="titre" id="titre"></p>
    <p class="meta" id="meta"></p>
    <button class="ouvrir" id="ouvrir" type="button">Ouvrir le film</button>
  </div>
</div>

<div class="fiche" id="fiche" aria-hidden="true">
  <div class="fiche-inner">
    <button class="retour" id="retour" type="button"><span aria-hidden="true">&larr;</span> Retour au flux</button>
    <h1 class="f-titre" id="f-titre"></h1>
    <div class="f-meta" id="f-meta"></div>
    <p class="f-note" id="f-note"></p>
  </div>
</div>

<div class="aide" id="aide">Défiler doucement · tirer d'un coup sec · ouvrir</div>
<div class="porte" id="porte"><button id="entrer" type="button">Enter<span></span></button></div>

<script>
/* ============================================================
   BINKSFILMS — LAB / expérience
   Prototype isolé de structure. Ne touche pas au site.

   Ce n'est plus une démonstration d'effet : c'est le système.

   UNE SEULE COURBE D'INTENSITÉ, exprimée en plans par seconde, donc
   indépendante de la machine :

     repos       0 plan/s             image nette, rien d'ajouté
     lent      < 1,1 plan/s           fusion par les hautes lumières
     franc     1,1 -> 3,2 plans/s     la matière se déchire
     arrachage > 3,2 plans/s          bandes fines, filé, écart chromatique

   TROIS RÈGLES DE STRUCTURE, et ce sont elles le vrai livrable :

   1. La grammaire vit dans le FLUX, et nulle part ailleurs. La fiche
      est une zone de silence : aucun effet n'y entre, jamais. Un
      langage qui n'a pas d'endroit interdit devient un thème.

   2. Rien ne passe par du noir. Ouvrir un film ne coupe pas : le plan
      qu'on regardait reste là et devient le fond de sa propre fiche.

   3. Le texte et la navigation ne subissent jamais l'effet. L'image se
      tord ; l'information reste lisible.

   Un futur effet devra déclarer dans quelle zone il vit, ou il n'entre
   pas dans le système.
   ============================================================ */

var PLANS = [
  { src:"videos/hero-loop.mp4", type:"v", artiste:"BINKSFILMS", titre:"Le ciel", meta:"Accueil · boucle",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"images/fulltrap-skinny-bastard-skinny-bastard-s-flow-type-shit-bann.jpg", type:"i",
    artiste:"FullTrap & Skinny Bastard", titre:"Skinny Bastard's Flow", meta:"Clip · 2026",
    credits:[["Réalisation, image & montage","BINKSFILMS"],["Produced","FullTrap"]],
    note:"FullTrap & Skinny Bastard — Skinny Bastard's Flow (type shit). Directed by BinksFilms." },
  { src:"videos/skinny.mp4", type:"v", artiste:"FullTrap & Skinny Bastard", titre:"La voiture",
    meta:"Plan · étalonné", credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"images/fulltrap-skinny-bastard-skinny-bastard-s-flow-type-shit-plan.jpg", type:"i",
    artiste:"FullTrap & Skinny Bastard", titre:"Le plan", meta:"Contre-champ · étalonné",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"images/00079.MTS.00_01_37_00.Still001.jpg", type:"i",
    artiste:"FullTrap & Skinny Bastard", titre:"Derrière la caméra", meta:"Rush · brut",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"images/Adjustment Layer.00_01_57_23.Still018.jpg", type:"i",
    artiste:"FullTrap & Skinny Bastard", titre:"Fisheye", meta:"Plan · étalonné",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"videos/previews/saisai-fin-des-temps-feat-boro700-preview.mp4", type:"v",
    artiste:"SaiSai feat Boro700", titre:"Fin des temps", meta:"Clip · 2026",
    credits:[["Réalisation, image & montage","BINKSFILMS"],["Produced by","—"]], note:"" },
  { src:"images/saisai-fin-des-temps-feat-boro700-banner-2.jpg", type:"i",
    artiste:"SaiSai feat Boro700", titre:"Fin des temps", meta:"Bannière",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"images/skinny.jpg", type:"i", artiste:"FullTrap & Skinny Bastard", titre:"L'habitacle",
    meta:"Plan · étalonné", credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" },
  { src:"videos/video intro.mp4", type:"v", artiste:"BINKSFILMS", titre:"La porte", meta:"Intro · boucle",
    credits:[["Réalisation, image & montage","BINKSFILMS"]], note:"" }
];

var cv = document.getElementById("c");
var gl = cv.getContext("webgl", {antialias:false, alpha:false, powerPreference:"high-performance"});
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

var VERT = "attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}";
var FRAG = [
"precision highp float;",
"varying vec2 uv;","uniform sampler2D A,B;","uniform vec2 rA,rB,res;","uniform float t,tir,temps;",
"vec2 cover(vec2 u, vec2 r){",
"  float ar=res.x/res.y, ai=r.x/r.y;",
"  vec2 s = ar>ai ? vec2(1.0, ai/ar) : vec2(ar/ai, 1.0);",
"  return (u-0.5)/s + 0.5;",
"}",
"float bruit(vec2 x){ return fract(sin(dot(x, vec2(12.9898,78.233)))*43758.5453); }",
"float lisse(vec2 x){ vec2 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);",
"  return mix(mix(bruit(i),bruit(i+vec2(1.,0.)),f.x), mix(bruit(i+vec2(0.,1.)),bruit(i+vec2(1.,1.)),f.x), f.y); }",
"float fbm(vec2 x){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*lisse(x); x*=2.03; a*=.5; } return s; }",
"float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }",
"vec2 arracher(vec2 u, float f){",
"  if(f <= 0.001) return u;",
"  float n = 7.0 + f*32.0;",
"  float b = floor(u.y*n), r = bruit(vec2(b,3.7));",
"  u.x += (r-0.5)*f*0.30; u.y += (r-0.5)*f*0.05; return u;",
"}",
"void main(){",
"  float dechire = smoothstep(1.10, 3.20, tir);",
"  float file = min(tir*0.42, 1.4);",
"  vec2 ua = arracher(cover(uv,rA), dechire), ub = arracher(cover(uv,rB), dechire);",
"  vec3 a = texture2D(A, ua).rgb;",
"  float grain = fbm(uv*vec2(res.x/res.y,1.0)*3.2 + temps*0.05);",
"  float seuil = (1.0-lum(a))*0.58 + grain*0.26;",
"  float m = smoothstep(seuil-0.13, seuil+0.13, t*1.26-0.10);",
"  float bord = 1.0 - abs(m*2.0-1.0);",
"  float e = file*0.024 + bord*0.010;",
"  vec3 col = vec3(0.0);",
"  for(int k=0;k<4;k++){",
"    float d = (float(k)/3.0-0.5)*e;",
"    col += mix(texture2D(A, ua+vec2(0.,d)).rgb, texture2D(B, ub+vec2(0.,d)).rgb, m)*0.25;",
"  }",
"  float ec = file*0.009 + bord*0.007;",
"  col.r = mix(texture2D(A, ua+vec2(ec,0.)).r, texture2D(B, ub+vec2(ec,0.)).r, m);",
"  col.b = mix(texture2D(A, ua-vec2(ec,0.)).b, texture2D(B, ub-vec2(ec,0.)).b, m);",
"  col += vec3(0.44,0.05,0.10)*pow(bord,3.0)*0.5;",
"  float d2 = distance(uv, vec2(0.5));",
"  col *= 1.0 - d2*d2*0.52;",
"  gl_FragColor = vec4(col,1.0);",
"}"].join("\n");

function compiler(ty,src){ var s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; } return s; }

var prog, loc={}, sources=[], texs=[], prets=[], dims=[];
function initGL(){
  var vs=compiler(gl.VERTEX_SHADER,VERT), fs=compiler(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return false;
  prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var p=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
  ["A","B","rA","rB","res","t","tir","temps"].forEach(function(n){ loc[n]=gl.getUniformLocation(prog,n); });
  gl.uniform1i(loc.A,0); gl.uniform1i(loc.B,1); return true;
}
function creerTexture(){ var t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([10,10,10])); return t; }

function preparer(){
  var hote=document.getElementById("medias");
  PLANS.forEach(function(pl,i){
    texs[i]=creerTexture(); prets[i]=false; dims[i]=[16,9];
    if(pl.type==="v"){
      var v=document.createElement("video");
      v.src=pl.src; v.muted=true; v.loop=true; v.playsInline=true; v.preload="metadata";
      v.setAttribute("playsinline",""); v.setAttribute("muted","");
      v.addEventListener("loadeddata",function(){ prets[i]=true; dims[i]=[v.videoWidth,v.videoHeight]; });
      v.addEventListener("error",function(){ prets[i]="ko"; });
      hote.appendChild(v); sources[i]=v;
    } else {
      var im=new Image();
      im.onload=function(){ dims[i]=[im.naturalWidth,im.naturalHeight];
        gl.bindTexture(gl.TEXTURE_2D,texs[i]);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im); prets[i]="fixe"; };
      im.onerror=function(){ prets[i]="ko"; };
      im.src=pl.src; sources[i]=im;
    }
  });
}
/* budget de décodage : deux vidéos au maximum, et zéro quand la fiche
   est ouverte — rien ne doit tourner derrière une zone de silence */
function arbitrer(i){
  PLANS.forEach(function(pl,k){
    if(pl.type!=="v") return;
    var v=sources[k], actif = !ficheOuverte && (k===i || k===i+1);
    if(actif){ if(v.paused) v.play().catch(function(){}); }
    else if(!v.paused) v.pause();
  });
}

var position=0, cible=0, tir=0, dernier=0, dernierIdx=-1, ficheOuverte=false, dernierFiche=null;
function N(){ return PLANS.length; }
function pousser(d){ if(ficheOuverte) return; cible=Math.max(0,Math.min(N()-1,cible+d)); }
addEventListener("wheel",function(e){ pousser(e.deltaY*0.0017); },{passive:true});
var ty=null;
addEventListener("touchstart",function(e){ if(!ficheOuverte) ty=e.touches[0].clientY; },{passive:true});
addEventListener("touchmove",function(e){ if(ty===null||ficheOuverte) return;
  var y=e.touches[0].clientY; pousser((ty-y)*0.0054); ty=y; },{passive:true});
addEventListener("touchend",function(){ ty=null; },{passive:true});
addEventListener("keydown",function(e){
  if(e.key==="Escape" && ficheOuverte) return fermer();
  if(ficheOuverte) return;
  if(e.key==="ArrowDown"||e.key==="PageDown"||e.key===" ") pousser(1);
  if(e.key==="ArrowUp"||e.key==="PageUp") pousser(-1);
  if(e.key==="Enter") ouvrir();
});

function cartel(i){
  var p=PLANS[i]; if(!p) return;
  document.getElementById("artiste").textContent=p.artiste;
  document.getElementById("titre").textContent=p.titre;
  document.getElementById("meta").textContent=p.meta;
  document.getElementById("bobine").textContent=
    String(i+1).padStart(2,"0")+" / "+String(N()).padStart(2,"0");
}

/* ---------- 2. LA ZONE DE SILENCE ----------
   Ouvrir ne coupe pas. Le flux s'arrête sur le plan regardé, la fiche
   monte par-dessus, et l'effet est mis à zéro — pas atténué : à zéro. */
var fiche=document.getElementById("fiche"), flux=document.getElementById("flux");
function ouvrir(){
  if(ficheOuverte) return;
  var i=Math.round(position);
  var p=PLANS[Math.max(0,Math.min(N()-1,i))];
  cible=i; ficheOuverte=true; tir=0;
  document.getElementById("f-titre").innerHTML=
    '<em>'+p.artiste+'</em> — '+p.titre;
  document.getElementById("f-meta").innerHTML=
    p.credits.map(function(c){ return '<div class="f-row"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }).join("")
    + '<div class="f-row"><b>Type</b><span>'+p.meta+'</span></div>';
  var n=document.getElementById("f-note"); n.textContent=p.note||""; n.style.display=p.note?"":"none";
  fiche.classList.add("on"); fiche.setAttribute("aria-hidden","false");
  flux.classList.add("retire");
  arbitrer(i);                 /* dans le clic : il porte l'autorisation de lecture */
  document.getElementById("retour").focus();
}
function fermer(){
  if(!ficheOuverte) return;
  ficheOuverte=false;
  fiche.classList.remove("on"); fiche.setAttribute("aria-hidden","true");
  flux.classList.remove("retire");
  fiche.scrollTop=0;
  /* Reprise posée ici, dans le geste. Une reprise différée à la boucle
     peut arriver après l'expiration de l'autorisation de lecture
     accordée par le clic — la boucle ne sert plus que de filet. */
  arbitrer(Math.max(0,Math.min(N()-2,Math.floor(position))));
  document.getElementById("ouvrir").focus();
}
document.getElementById("ouvrir").addEventListener("click",ouvrir);
document.getElementById("retour").addEventListener("click",fermer);

function redim(){ var d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(innerWidth*d); cv.height=Math.round(innerHeight*d); gl.viewport(0,0,cv.width,cv.height); }
addEventListener("resize",redim);

function poser(u,i){
  gl.activeTexture(u===0?gl.TEXTURE0:gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,texs[i]);
  if(PLANS[i].type==="v" && prets[i]===true && sources[i].readyState>=2 && !sources[i].paused){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,sources[i]);
  }
}

function boucle(now){
  var avantTemps=dernier;
  var dt=Math.min((now-dernier)/16.67,3); dernier=now;
  var avant=position;
  position += (cible-position)*(reduced?1:0.065)*dt;

  /* vitesse réelle, en plans par seconde : les seuils veulent dire la
     même chose sur toutes les machines */
  var secondes=Math.max((now-avantTemps)/1000,0.001);
  var vitesse=Math.abs(position-avant)/secondes;
  var retombee=Math.pow(0.02,secondes);
  tir = (reduced||ficheOuverte) ? 0 : Math.min(Math.max(vitesse,tir*retombee),6.0);
  if(tir<0.02) tir=0;

  var i=Math.max(0,Math.min(N()-2,Math.floor(position)));
  var t=Math.max(0,Math.min(1,position-i));
  var vu = t>0.5 ? i+1 : i;
  /* La lecture est arbitrée depuis la boucle, pas au moment du clic :
     une reprise posée dans un gestionnaire peut être perdue si l'état
     change pendant la transition. Ici elle ne peut pas l'être. */
  if(vu!==dernierIdx || ficheOuverte!==dernierFiche){
    dernierIdx=vu; dernierFiche=ficheOuverte; cartel(vu); arbitrer(i);
  }

  poser(0,i); poser(1,Math.min(i+1,N()-1));
  var j=Math.min(i+1,N()-1);
  gl.uniform2f(loc.rA,dims[i][0],dims[i][1]);
  gl.uniform2f(loc.rB,dims[j][0],dims[j][1]);
  gl.uniform2f(loc.res,cv.width,cv.height);
  gl.uniform1f(loc.t,t); gl.uniform1f(loc.tir,tir); gl.uniform1f(loc.temps,now*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(boucle);
}

/* ---------- repli ----------
   Sans WebGL : les mêmes plans empilés en plein écran, la même fiche,
   la même structure. On perd la matière, pas le système. */
function repli(){
  cv.style.display="none";
  var d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#0A0A0A;z-index:1";
  PLANS.forEach(function(p,k){
    var s=document.createElement("section");
    s.style.cssText="height:100svh;scroll-snap-align:start;position:relative;overflow:hidden";
    if(p.type==="v"){
      var v=document.createElement("video");
      v.src=p.src; v.muted=true; v.loop=true; v.autoplay=true; v.setAttribute("playsinline","");
      v.style.cssText="width:100%;height:100%;object-fit:cover"; s.appendChild(v);
    } else {
      s.style.backgroundImage="url('"+p.src.replace(/'/g,"%27")+"')";
      s.style.backgroundSize="cover"; s.style.backgroundPosition="center";
    }
    s.addEventListener("click",function(){ position=k; cible=k; ouvrir(); });
    d.appendChild(s);
  });
  document.body.appendChild(d);
  ["porte","aide"].forEach(function(id){ document.getElementById(id).classList.add("off"); });
}

document.getElementById("entrer").addEventListener("click",function(){
  document.getElementById("porte").classList.add("off");
  if(!gl||!initGL()) return repli();
  preparer(); arbitrer(0); cartel(0); redim();
  dernier=performance.now(); requestAnimationFrame(boucle);
  setTimeout(function(){ document.getElementById("aide").classList.add("off"); },6500);
});
</script>
