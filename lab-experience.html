<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINKSFILMS — LAB / expérience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LA STRUCTURE, EN TROIS ZONES

   1. LE FLUX     langage permanent. La grammaire d'intensité y vit,
                  et seulement là. Une entrée = un film publié.
   2. LA FICHE    zone de silence. Aucun effet, jamais. C'est la règle
                  qui empêche la grammaire de devenir un thème.
   3. LES SEUILS  l'entrée et le retour. Continus, sans noir.

   Un futur effet devra déclarer dans quelle zone il vit, ou il
   n'entre pas.
   ============================================================ */
:root{color-scheme:dark;--noir:#0A0A0A;--ivoire:#EDEBE6;--gris:#8E8A84;--gris2:#5C5955;--rouge:#B11226;
  --ligne:rgba(237,235,230,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--noir);overflow:hidden;
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:var(--ivoire);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#medias video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px}
::selection{background:rgba(177,18,38,.5);color:#fff}
:focus-visible{outline:1px solid var(--rouge);outline-offset:3px}

.flux{position:fixed;inset:0;z-index:2;pointer-events:none;transition:opacity .5s ease}
.flux.retire{opacity:0}
.cartel{position:absolute;left:0;right:0;bottom:0;padding:0 28px 34px;
  background:linear-gradient(to top,rgba(6,6,6,.9),rgba(6,6,6,.42) 36%,rgba(6,6,6,0) 78%)}
@media(min-width:900px){.cartel{padding:0 48px 46px}}
.artiste{font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(14px,1.9vw,18px);line-height:1.1}
.titre{font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:clamp(27px,6vw,70px);line-height:1.02;margin-top:2px}
.meta{margin-top:9px;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,235,230,.55);font-variant-numeric:tabular-nums}
.ouvrir{margin-top:20px;pointer-events:auto;background:none;border:0;border-bottom:1px solid var(--ligne);
  font-family:inherit;color:var(--ivoire);font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;padding:0 0 6px;cursor:pointer;transition:border-color .3s}
.ouvrir:hover{border-color:var(--ivoire)}
.bobine{position:absolute;top:0;right:0;padding:24px 28px;
  font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--gris);font-variant-numeric:tabular-nums}
@media(min-width:900px){.bobine{padding:28px 48px}}
.marque{position:fixed;top:0;left:0;padding:22px 28px;z-index:3;pointer-events:none}
@media(min-width:900px){.marque{padding:26px 48px}}
.marque b{display:block;font-weight:800;font-stretch:125%;text-transform:uppercase;font-size:12px;letter-spacing:.26em}
.marque i{display:block;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:11px;color:var(--gris);margin-top:1px}

.fiche{position:fixed;inset:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .62s cubic-bezier(.16,1,.3,1);
  background:linear-gradient(to bottom,rgba(10,10,10,.55) 0%,rgba(10,10,10,.93) 46%,var(--noir) 78%)}
.fiche.on{transform:none}
.fiche-inner{max-width:1100px;margin:0 auto;padding:44vh 28px 90px}
@media(min-width:900px){.fiche-inner{padding:40vh 48px 120px}}
.retour{background:none;border:0;font-family:inherit;color:var(--gris);cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:0 0 22px;
  display:inline-flex;gap:9px;align-items:center;transition:color .3s}
.retour:hover{color:var(--ivoire)}
.f-titre{font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em;
  font-size:clamp(30px,5.4vw,66px);line-height:.96;margin-top:6px}
.f-titre .a{color:#9A958F}
.f-meta{margin-top:32px;display:flex;flex-direction:column;gap:9px;max-width:60ch}
.f-row{display:flex;gap:18px;font-size:14px;color:var(--gris)}
.f-row b{color:var(--ivoire);font-weight:600;min-width:150px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;line-height:1.5;padding-top:2px}
.f-row span{flex:1 1 auto;min-width:0;overflow-wrap:break-word}
@media(max-width:420px){.f-row b{min-width:112px;max-width:48%}}
.f-row a{color:inherit;border-bottom:1px solid var(--ligne);text-decoration:none;transition:border-color .3s,color .3s}
.f-row a:hover{color:var(--ivoire);border-color:var(--ivoire)}
.f-note{margin-top:38px;max-width:34em;font-family:'Newsreader',Georgia,serif;font-size:19px;line-height:1.6;
  white-space:pre-line}
.f-player{position:relative;aspect-ratio:16/9;margin:4px 0 38px;background:#050505;overflow:hidden}
.f-player img,.f-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.f-player img{object-fit:cover}
.f-player .play-film{position:absolute;inset:0;border:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.36));
  color:var(--ivoire);cursor:pointer;display:grid;place-items:center}
.f-player .play-film span{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;
  border:1px solid rgba(237,235,230,.55);background:rgba(10,10,10,.48);font-size:20px;padding-left:4px}
.f-sect{margin-top:58px}
.f-lab{display:block;margin-bottom:14px;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}
.cc{position:relative;aspect-ratio:16/9;overflow:hidden;background:#050505;cursor:hold}
.cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .28s ease}
.cc img.b{opacity:0}.cc.hold img.b{opacity:1}
.cc .hint{position:absolute;left:14px;bottom:12px;padding:7px 9px;background:rgba(10,10,10,.7);
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(237,235,230,.8)}
.cc-leg{margin-top:10px;color:var(--gris);font-size:13px}
.bts{display:grid;grid-template-columns:1fr;gap:10px}
.bts img{display:block;width:100%;height:auto}
@media(min-width:700px){.bts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f-nav{margin-top:72px;border-top:1px solid var(--ligne);display:grid;grid-template-columns:1fr 1fr}
.f-nav button{min-width:0;padding:24px 0;border:0;background:none;color:var(--gris);font:inherit;cursor:pointer;text-align:left}
.f-nav button:last-child{text-align:right}
.f-nav .dir{display:block;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gris2)}
.f-nav .name{display:block;margin-top:7px;color:var(--ivoire);font-size:14px;overflow-wrap:anywhere}
.f-nav button:hover .name{color:#fff}

.porte{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:var(--noir);transition:opacity .7s ease}
.porte.off{opacity:0;pointer-events:none}
.porte button{background:none;border:0;color:var(--ivoire);font-family:inherit;cursor:pointer;
  font-size:12px;font-weight:300;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;padding:18px 24px}
.porte span{display:block;width:62px;height:1px;background:rgba(237,235,230,.5);margin:13px auto 0}
.aide{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 0 13px;z-index:3;
  font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,235,230,.32);
  transition:opacity .8s ease;pointer-events:none}
.aide.off{opacity:0}

/* ---------- mouvement réduit ----------
   Le JS neutralisait déjà l'intensité du shader. Il manquait la
   structure : sans ça la fiche gardait sa translation de 620 ms,
   c'est-à-dire exactement le mouvement qu'on demande de supprimer. */
@media(prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
  .aide{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="medias"></div>

<div class="marque"><b>Binksfilms</b><i>Les beaux arts du ghetto</i></div>

<div class="flux" id="flux">
  <div class="bobine" id="bobine">— / —</div>
  <div class="cartel">
    <p class="artiste" id="artiste"></p>
    <p class="titre" id="titre"></p>
    <p class="meta" id="meta"></p>
    <button class="ouvrir" id="ouvrir" type="button">Ouvrir le film</button>
  </div>
</div>

<div class="fiche" id="fiche" aria-hidden="true">
  <div class="fiche-inner">
    <button class="retour" id="retour" type="button"><span aria-hidden="true">&larr;</span> Retour au flux</button>
    <div class="f-player" id="f-player" hidden></div>
    <h1 class="f-titre" id="f-titre"></h1>
    <div class="f-meta" id="f-meta"></div>
    <p class="f-note" id="f-note"></p>
    <div id="f-extra"></div>
    <nav class="f-nav" id="f-nav" aria-label="Autres films"></nav>
  </div>
</div>

<div class="aide" id="aide">Défiler doucement · tirer d'un coup sec · ouvrir</div>
<div class="porte" id="porte"><button id="entrer" type="button">Enter<span></span></button></div>

<script src="films.js"></script>
<script>
/* ============================================================
   BINKSFILMS — LAB / expérience — VERSION 2, sur les vraies données
   Prototype isolé. Ne touche pas au site.

   Ce qui change, et pourquoi. La version 1 portait son propre tableau
   de plans écrit à la main, qui avait déjà divergé de la source : le
   crédit « Produced by » de SaiSai y était remplacé par un tiret,
   c'est-à-dire un crédit inventé sur le travail de quelqu'un. Un
   prototype qui montre des films doit lire les films.

   Désormais :
   - les entrées viennent de window.FILMS_DATA, filtrées comme le site,
     donc UNE ENTRÉE = UN FILM PUBLIÉ ;
   - l'image suit la chaîne de secours du site : bannière locale, puis
     miniature YouTube haute définition, puis standard ;
   - la preview ne joue que si le film en a une et que le réseau le
     permet ;
   - crédits, date, type et lien viennent de films.js, posés en texte
     et jamais en HTML.

   UNE SEULE COURBE D'INTENSITÉ, en plans par seconde :
     repos 0 · lent < 1,1 · franc 1,1→3,2 · arrachage > 3,2
   ============================================================ */

function enLigne(f){
  if(!f || !f.yt) return false;
  if(f.status) return f.status === "published";
  return !f.archive;
}
function annee(f){ return (f.sortie || "").slice(0,4); }
function dateLongue(f){
  if(!f.sortie) return "";
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f.sortie);
  if(!m) return f.sortie;
  var mois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  return String(parseInt(m[3],10))+" "+mois[parseInt(m[2],10)-1]+" "+m[1];
}

var FILMS = (window.FILMS_DATA || []).filter(enLigne).map(function(f){
  var cred = (f.credits || []).filter(function(c){
    return c && c.length >= 2 && String(c[0]).trim() && String(c[1]).trim();
  });
  var pv = f.preview ? (typeof f.preview === "string" ? f.preview : f.preview.src) : "";
  var cc = null;
  if(f.contrechamp && f.contrechamp.a && f.contrechamp.b){
    cc = {a:f.contrechamp.a, b:f.contrechamp.b, legende:f.contrechamp.legende || ""};
  }
  return {
    slug:f.slug, yt:f.yt, artiste:f.artist || "", titre:f.title || "",
    sortie:f.sortie || "", type:f.type || "Clip", note:f.note || "",
    lieu:f.lieu || "", tournage:f.tournage || "",
    poster:f.poster || "", preview:pv, credits:cred,
    contrechamp:cc, bts:(f.bts || []).filter(Boolean)
  };
});

var cv = document.getElementById("c");
var gl = cv.getContext("webgl", {antialias:false, alpha:false, powerPreference:"high-performance"});
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* conscience du réseau, reprise du site : Save-Data ou connexion lente,
   aucune vidéo n'est chargée. Le flux garde sa grammaire, il coûte
   simplement beaucoup moins. */
var co = navigator.connection;
var reseauEconome = !!(co && (co.saveData || /(^|-)2g$/.test(co.effectiveType || "")));

var VERT = "attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}";
var FRAG = [
"precision highp float;","varying vec2 uv;","uniform sampler2D A,B;",
"uniform vec2 rA,rB,res;","uniform float t,tir,temps;",
"vec2 cover(vec2 u, vec2 r){",
"  float ar=res.x/res.y, ai=r.x/r.y;",
"  vec2 s = ar>ai ? vec2(1.0, ai/ar) : vec2(ar/ai, 1.0);",
"  return (u-0.5)/s + 0.5;",
"}",
"float bruit(vec2 x){ return fract(sin(dot(x, vec2(12.9898,78.233)))*43758.5453); }",
"float lisse(vec2 x){ vec2 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);",
"  return mix(mix(bruit(i),bruit(i+vec2(1.,0.)),f.x), mix(bruit(i+vec2(0.,1.)),bruit(i+vec2(1.,1.)),f.x), f.y); }",
"float fbm(vec2 x){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*lisse(x); x*=2.03; a*=.5; } return s; }",
"float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }",
"vec2 arracher(vec2 u, float f){",
"  if(f <= 0.001) return u;",
"  float n = 7.0 + f*32.0;",
"  float b = floor(u.y*n), r = bruit(vec2(b,3.7));",
"  u.x += (r-0.5)*f*0.30; u.y += (r-0.5)*f*0.05; return u;",
"}",
"void main(){",
"  float dechire = smoothstep(1.10, 3.20, tir);",
"  float file = min(tir*0.42, 1.4);",
"  vec2 ua = arracher(cover(uv,rA), dechire), ub = arracher(cover(uv,rB), dechire);",
"  vec3 a = texture2D(A, ua).rgb;",
"  float grain = fbm(uv*vec2(res.x/res.y,1.0)*3.2 + temps*0.05);",
"  float seuil = (1.0-lum(a))*0.58 + grain*0.26;",
"  float m = smoothstep(seuil-0.13, seuil+0.13, t*1.26-0.10);",
"  float bord = 1.0 - abs(m*2.0-1.0);",
"  float e = file*0.024 + bord*0.010;",
"  vec3 col = vec3(0.0);",
"  for(int k=0;k<4;k++){",
"    float d = (float(k)/3.0-0.5)*e;",
"    col += mix(texture2D(A, ua+vec2(0.,d)).rgb, texture2D(B, ub+vec2(0.,d)).rgb, m)*0.25;",
"  }",
"  float ec = file*0.009 + bord*0.007;",
"  col.r = mix(texture2D(A, ua+vec2(ec,0.)).r, texture2D(B, ub+vec2(ec,0.)).r, m);",
"  col.b = mix(texture2D(A, ua-vec2(ec,0.)).b, texture2D(B, ub-vec2(ec,0.)).b, m);",
"  col += vec3(0.44,0.05,0.10)*pow(bord,3.0)*0.5;",
"  float d2 = distance(uv, vec2(0.5));",
"  col *= 1.0 - d2*d2*0.52;",
"  gl_FragColor = vec4(col,1.0);",
"}"].join("\n");

function compiler(ty,src){ var s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; } return s; }

var prog, loc={}, texs=[], dims=[], videos=[], pretes=[];
function initGL(){
  var vs=compiler(gl.VERTEX_SHADER,VERT), fs=compiler(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return false;
  prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  /* WebGL remplit les textures de bas en haut alors qu'une image et une
     vidéo se lisent de haut en bas : sans cette ligne, tout est
     retourné. Le défaut est resté invisible pendant quatre prototypes. */
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var p=gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
  ["A","B","rA","rB","res","t","tir","temps"].forEach(function(n){ loc[n]=gl.getUniformLocation(prog,n); });
  gl.uniform1i(loc.A,0); gl.uniform1i(loc.B,1); return true;
}
function creerTexture(){
  var t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([10,10,10]));
  return t;
}

/* ---------- la chaîne de secours des images, celle du site ----------
   bannière locale -> miniature haute définition -> miniature standard.
   Les miniatures YouTube autorisent le partage d'origine, elles sont
   donc utilisables comme texture. La vignette grise que YouTube renvoie
   parfois est détectée par sa largeur et rejetée, comme dans index.html. */
function chargerImage(i){
  var f = FILMS[i], etapes = [];
  if(f.poster) etapes.push({url:f.poster, local:true});
  etapes.push({url:"https://i.ytimg.com/vi/"+f.yt+"/maxresdefault.jpg", local:false});
  etapes.push({url:"https://i.ytimg.com/vi/"+f.yt+"/hqdefault.jpg", local:false});
  var k = 0;
  function suivant(){
    if(k >= etapes.length) return;          /* rien de lisible : le plan garde son noir */
    var e = etapes[k++];
    var im = new Image();
    if(!e.local) im.crossOrigin = "anonymous";
    im.onload = function(){
      if(!e.local && im.naturalWidth < 200) return suivant();   /* vignette grise */
      dims[i] = [im.naturalWidth, im.naturalHeight];
      gl.bindTexture(gl.TEXTURE_2D, texs[i]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
      if(pretes[i] !== "video") pretes[i] = "image";
    };
    im.onerror = suivant;
    im.src = e.url;
  }
  suivant();
}

function preparer(){
  var hote = document.getElementById("medias");
  FILMS.forEach(function(f,i){
    texs[i] = creerTexture(); dims[i] = [16,9]; pretes[i] = false; videos[i] = null;
    chargerImage(i);
    if(f.preview && !reseauEconome && !reduced){
      var v = document.createElement("video");
      v.src = f.preview; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "none";
      v.setAttribute("playsinline",""); v.setAttribute("muted","");
      v.addEventListener("loadeddata", function(){
        if(v.videoWidth){ dims[i] = [v.videoWidth, v.videoHeight]; pretes[i] = "video"; }
      });
      v.addEventListener("error", function(){ videos[i] = null; });   /* on garde l'image */
      hote.appendChild(v); videos[i] = v;
    }
  });
}

/* budget de décodage : deux vidéos au maximum dans le flux, zéro quand
   la fiche est ouverte ou quand l'onglet est caché */
function arbitrer(i){
  var autorise = !ficheOuverte && !document.hidden;
  FILMS.forEach(function(f,k){
    var v = videos[k]; if(!v) return;
    if(autorise && (k===i || k===i+1)){ if(v.paused) v.play().catch(function(){}); }
    else if(!v.paused) v.pause();
  });
}
document.addEventListener("visibilitychange", function(){
  arbitrer(Math.max(0, Math.min(Math.max(FILMS.length-2,0), Math.floor(position))));
});

var position=0, cible=0, tir=0, dernier=0, dernierIdx=-1, ficheOuverte=false, dernierFiche=null;
function N(){ return FILMS.length; }
function pousser(d){ if(ficheOuverte) return; cible=Math.max(0,Math.min(N()-1,cible+d)); }
addEventListener("wheel",function(e){ pousser(e.deltaY*0.0017); },{passive:true});
var ty=null;
addEventListener("touchstart",function(e){ if(!ficheOuverte) ty=e.touches[0].clientY; },{passive:true});
addEventListener("touchmove",function(e){ if(ty===null||ficheOuverte) return;
  var y=e.touches[0].clientY; pousser((ty-y)*0.0054); ty=y; },{passive:true});
addEventListener("touchend",function(){ ty=null; },{passive:true});
addEventListener("keydown",function(e){
  if(e.key==="Escape" && ficheOuverte) return fermer();
  if(ficheOuverte) return;
  if(e.key==="ArrowDown"||e.key==="PageDown"||e.key===" ") pousser(1);
  if(e.key==="ArrowUp"||e.key==="PageUp") pousser(-1);
  if(e.key==="Enter") ouvrir();
});

function cartel(i){
  var f=FILMS[i]; if(!f) return;
  document.getElementById("artiste").textContent = f.artiste;
  document.getElementById("titre").textContent = f.titre;
  document.getElementById("meta").textContent = f.type + " · " + annee(f);
  document.getElementById("bobine").textContent =
    String(i+1).padStart(2,"0") + " / " + String(N()).padStart(2,"0");
}

/* ---------- la fiche, en nœuds de texte ----------
   Aucune valeur de films.js ne passe par innerHTML : ces données sont
   éditées dans admin.html et rien ne garantit qu'elles ne contiennent
   pas de caractères de balisage. */
function ligne(label, valeur, lien){
  var d=document.createElement("div"); d.className="f-row";
  var b=document.createElement("b"); b.textContent=label; d.appendChild(b);
  var s=document.createElement("span");
  if(lien){
    var a=document.createElement("a");
    a.href=lien; a.target="_blank"; a.rel="noopener"; a.textContent=valeur;
    s.appendChild(a);
  } else { s.textContent=valeur; }
  d.appendChild(s); return d;
}

var fiche=document.getElementById("fiche"), flux=document.getElementById("flux");

function posterFilm(f){
  return f.poster || ("https://i.ytimg.com/vi/"+f.yt+"/maxresdefault.jpg");
}
function remplirLecteur(f){
  var p=document.getElementById("f-player"); p.textContent=""; p.hidden=false;
  var im=document.createElement("img"); im.src=posterFilm(f); im.alt="";
  im.onerror=function(){ im.onerror=null; im.src="https://i.ytimg.com/vi/"+f.yt+"/hqdefault.jpg"; };
  var b=document.createElement("button"); b.type="button"; b.className="play-film";
  b.setAttribute("aria-label","Lire "+[f.artiste,f.titre].filter(Boolean).join(" — "));
  var ic=document.createElement("span"); ic.textContent="▶"; b.appendChild(ic);
  b.addEventListener("click",function(){
    var frame=document.createElement("iframe");
    frame.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(f.yt)+"?autoplay=1&rel=0&playsinline=1";
    frame.title=[f.artiste,f.titre].filter(Boolean).join(" — ");
    frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    frame.allowFullscreen=true;
    p.textContent=""; p.appendChild(frame);
  });
  p.appendChild(im); p.appendChild(b);
}
function remplirExtras(f){
  var x=document.getElementById("f-extra"); x.textContent="";
  if(f.contrechamp){
    var s=document.createElement("section"); s.className="f-sect";
    var lab=document.createElement("span"); lab.className="f-lab"; lab.textContent="Contre-champ"; s.appendChild(lab);
    var cc=document.createElement("div"); cc.className="cc"; cc.tabIndex=0; cc.setAttribute("role","button");
    cc.setAttribute("aria-label","Maintenir pour voir le contre-champ");
    var a=document.createElement("img"); a.src=f.contrechamp.a; a.alt="";
    var b=document.createElement("img"); b.src=f.contrechamp.b; b.alt="Derrière la caméra"; b.className="b";
    var hint=document.createElement("span"); hint.className="hint"; hint.textContent="Maintenir pour voir derrière";
    cc.appendChild(a); cc.appendChild(b); cc.appendChild(hint); s.appendChild(cc);
    var on=function(e){ if(e) e.preventDefault(); cc.classList.add("hold"); };
    var off=function(){ cc.classList.remove("hold"); };
    cc.addEventListener("pointerdown",on); cc.addEventListener("pointerup",off); cc.addEventListener("pointerleave",off);
    cc.addEventListener("keydown",function(e){ if(e.key===" "||e.key==="Enter") on(e); });
    cc.addEventListener("keyup",off);
    if(f.contrechamp.legende){
      var l=document.createElement("p"); l.className="cc-leg"; l.textContent=f.contrechamp.legende; s.appendChild(l);
    }
    x.appendChild(s);
  }
  if(f.bts && f.bts.length){
    var t=document.createElement("section"); t.className="f-sect";
    var tl=document.createElement("span"); tl.className="f-lab"; tl.textContent="Tournage"; t.appendChild(tl);
    var g=document.createElement("div"); g.className="bts";
    f.bts.forEach(function(src){
      var im=document.createElement("img"); im.src=src; im.alt="Image de tournage"; im.loading="lazy";
      im.onerror=function(){ im.remove(); }; g.appendChild(im);
    });
    t.appendChild(g); x.appendChild(t);
  }
}
function remplirNav(i){
  var nav=document.getElementById("f-nav"); nav.textContent="";
  if(N()<2) return;
  [{label:"Précédent",idx:(i-1+N())%N()},{label:"Suivant",idx:(i+1)%N()}].forEach(function(o){
    var f=FILMS[o.idx], b=document.createElement("button"); b.type="button";
    var d=document.createElement("span"); d.className="dir"; d.textContent=o.label;
    var n=document.createElement("span"); n.className="name"; n.textContent=[f.artiste,f.titre].filter(Boolean).join(" — ");
    b.appendChild(d); b.appendChild(n);
    b.addEventListener("click",function(){
      position=o.idx; cible=o.idx; tir=0; remplirFiche(o.idx); fiche.scrollTo(0,0);
    });
    nav.appendChild(b);
  });
}
function remplirFiche(i){
  var f=FILMS[i]; if(!f) return;
  remplirLecteur(f);
  var h=document.getElementById("f-titre"); h.textContent="";
  var sa=document.createElement("span"); sa.className="a"; sa.textContent=f.artiste;
  h.appendChild(sa); h.appendChild(document.createTextNode(" — "+f.titre));

  var m=document.getElementById("f-meta"); m.textContent="";
  f.credits.forEach(function(c){ m.appendChild(ligne(c[0], c[1])); });
  if(f.lieu) m.appendChild(ligne("Lieu", f.lieu));
  if(f.tournage) m.appendChild(ligne("Tournage", f.tournage));
  if(f.sortie) m.appendChild(ligne("Sortie", dateLongue(f)));
  m.appendChild(ligne("Type", f.type));
  m.appendChild(ligne("Voir", "YouTube ↗", "https://www.youtube.com/watch?v="+f.yt));

  var note=document.getElementById("f-note");
  note.textContent=f.note || ""; note.style.display=f.note ? "" : "none";
  remplirExtras(f); remplirNav(i);
}
function ouvrir(){
  if(ficheOuverte || !N()) return;
  var i=Math.max(0,Math.min(N()-1,Math.round(position)));
  cible=i; ficheOuverte=true; tir=0;
  remplirFiche(i);
  fiche.classList.add("on"); fiche.setAttribute("aria-hidden","false");
  flux.classList.add("retire");
  arbitrer(i);
  document.getElementById("retour").focus();
}
function fermer(){
  if(!ficheOuverte) return;
  ficheOuverte=false;
  fiche.classList.remove("on"); fiche.setAttribute("aria-hidden","true");
  flux.classList.remove("retire"); fiche.scrollTop=0;
  document.getElementById("f-player").textContent="";
  arbitrer(Math.max(0,Math.min(Math.max(N()-2,0),Math.floor(position))));
  document.getElementById("ouvrir").focus();
}
document.getElementById("ouvrir").addEventListener("click",ouvrir);
document.getElementById("retour").addEventListener("click",fermer);

function redim(){
  /* la densité est plafonnée à 2, et à 1 sur réseau économe : le coût du
     shader est proportionnel au nombre de pixels */
  var d=Math.min(devicePixelRatio||1, reseauEconome ? 1 : 2);
  cv.width=Math.round(innerWidth*d); cv.height=Math.round(innerHeight*d);
  gl.viewport(0,0,cv.width,cv.height);
}
addEventListener("resize",redim);

function poser(u,i){
  gl.activeTexture(u===0?gl.TEXTURE0:gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,texs[i]);
  var v=videos[i];
  if(v && pretes[i]==="video" && v.readyState>=2 && !v.paused && !document.hidden){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,v);
  }
}

function boucle(now){
  /* onglet caché : on ne dessine pas et on ne décode pas */
  if(document.hidden){ dernier=now; return requestAnimationFrame(boucle); }

  var avantTemps=dernier;
  var dt=Math.min((now-dernier)/16.67,3); dernier=now;
  var avant=position;
  position += (cible-position)*(reduced?1:0.065)*dt;

  var secondes=Math.max((now-avantTemps)/1000,0.001);
  var vitesse=Math.abs(position-avant)/secondes;          /* plans par seconde */
  var retombee=Math.pow(0.02,secondes);
  tir = (reduced||ficheOuverte) ? 0 : Math.min(Math.max(vitesse,tir*retombee),6.0);
  if(tir<0.02) tir=0;

  var i=Math.max(0,Math.min(Math.max(N()-2,0),Math.floor(position)));
  var t=Math.max(0,Math.min(1,position-i));
  var vu = t>0.5 ? Math.min(i+1,N()-1) : i;
  if(vu!==dernierIdx || ficheOuverte!==dernierFiche){
    dernierIdx=vu; dernierFiche=ficheOuverte; cartel(vu); arbitrer(i);
  }

  poser(0,i); poser(1,Math.min(i+1,N()-1));
  var j=Math.min(i+1,N()-1);
  gl.uniform2f(loc.rA,dims[i][0],dims[i][1]);
  gl.uniform2f(loc.rB,dims[j][0],dims[j][1]);
  gl.uniform2f(loc.res,cv.width,cv.height);
  gl.uniform1f(loc.t,t); gl.uniform1f(loc.tir,tir); gl.uniform1f(loc.temps,now*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(boucle);
}

/* ---------- repli ----------
   Sans WebGL : les mêmes films, la même fiche, la même structure, en
   plein écran. On perd la matière, pas le système. */
function repli(){
  cv.style.display="none";
  var d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#0A0A0A;z-index:1";
  FILMS.forEach(function(f,k){
    var s=document.createElement("section");
    s.style.cssText="height:100svh;scroll-snap-align:start;position:relative;overflow:hidden;cursor:pointer";
    var im=document.createElement("img");
    im.src = f.poster || ("https://i.ytimg.com/vi/"+f.yt+"/maxresdefault.jpg");
    im.alt = ""; im.loading = "lazy";
    im.onerror = function(){ im.src = "https://i.ytimg.com/vi/"+f.yt+"/hqdefault.jpg"; };
    im.style.cssText="width:100%;height:100%;object-fit:cover";
    s.appendChild(im);
    s.addEventListener("click",function(){ position=k; cible=k; ouvrir(); });
    d.appendChild(s);
  });
  document.body.appendChild(d);
  ["porte","aide"].forEach(function(id){ document.getElementById(id).classList.add("off"); });
}

document.getElementById("entrer").addEventListener("click",function(){
  document.getElementById("porte").classList.add("off");
  if(!N()){ document.getElementById("titre").textContent = "Aucun film publié"; return; }
  if(!gl||!initGL()) return repli();
  preparer(); cartel(0); arbitrer(0); redim();
  dernier=performance.now(); requestAnimationFrame(boucle);
  setTimeout(function(){ document.getElementById("aide").classList.add("off"); },6500);
});
</script>
