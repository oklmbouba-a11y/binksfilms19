<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINKSFILMS — LAB / bande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--noir:#0A0A0A;--ivoire:#EDEBE6;--gris:#8E8A84}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--noir);overflow:hidden;
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;color:var(--ivoire);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px}

.cartel{position:fixed;left:0;right:0;bottom:0;padding:0 28px 34px;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(6,6,6,.9),rgba(6,6,6,.45) 34%,rgba(6,6,6,0) 76%)}
@media(min-width:900px){.cartel{padding:0 48px 46px}}
.artiste{font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(15px,2vw,19px);line-height:1.1}
.titre{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(28px,6.4vw,76px);line-height:1.02;margin-top:2px}
.meta{margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(237,235,230,.55);font-variant-numeric:tabular-nums}
.bobine{position:fixed;top:0;right:0;padding:24px 28px;z-index:2;pointer-events:none;
  font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--gris);font-variant-numeric:tabular-nums}
@media(min-width:900px){.bobine{padding:28px 48px}}
.marque{position:fixed;top:0;left:0;padding:22px 28px;z-index:2;pointer-events:none}
@media(min-width:900px){.marque{padding:26px 48px}}
.marque b{display:block;font-weight:800;font-stretch:125%;text-transform:uppercase;font-size:12px;letter-spacing:.26em}
.marque i{display:block;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:11px;color:var(--gris);margin-top:1px}
.porte{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--noir);
  transition:opacity .6s ease}
.porte.off{opacity:0;pointer-events:none}
.porte button{background:none;border:0;color:var(--ivoire);font-family:inherit;cursor:pointer;
  font-size:12px;font-weight:300;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;padding:18px 24px}
.porte span{display:block;width:62px;height:1px;background:rgba(237,235,230,.5);margin:13px auto 0}
.aide{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 0 14px;z-index:3;
  font-size:9.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,235,230,.38);
  transition:opacity .6s ease;pointer-events:none}
.aide.off{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="videos"></div>

<div class="marque"><b>Binksfilms</b><i>Les beaux arts du ghetto</i></div>
<div class="bobine" id="bobine">01 / 04</div>
<div class="cartel">
  <p class="artiste" id="artiste"></p>
  <p class="titre" id="titre"></p>
  <p class="meta" id="meta"></p>
</div>
<div class="aide" id="aide">Tirer</div>

<!-- La porte : une vidéo ne démarre pas sans geste. C'est la contrainte
     des navigateurs, et c'est aussi le langage du site — on entre, on
     n'attend pas qu'on nous fasse entrer. -->
<div class="porte" id="porte"><button id="entrer" type="button">Enter<span></span></button></div>

<script>
/* ============================================================
   BINKSFILMS — LAB / bande
   Prototype isolé. Ne touche pas au site.

   Le flux précédent fondait des images fixes. Ici la matière est
   vivante : les plans jouent pendant la fonte, et le défilement ne
   fait plus avancer une position — il TIRE la bande.

   Trois choses arrivent quand on tire vite :
   - la matière s'étire dans le sens du geste, et se déchire par
     bandes horizontales décalées, comme une pellicule qu'on arrache ;
   - le fondu s'ouvre par les hautes lumières du plan en cours, donc
     chaque film se consume par ses propres sources ;
   - au repos, tout se recompose. Aucun effet ne subsiste à l'arrêt.

   C'est la règle qui empêche l'ensemble de devenir un filtre : tout
   ce qui se voit est produit par le geste, et disparaît avec lui.
   ============================================================ */

var PLANS = [
  { src:"videos/hero-loop.mp4",  artiste:"BINKSFILMS", titre:"Le ciel",       meta:"Accueil · boucle" },
  { src:"videos/previews/saisai-fin-des-temps-feat-boro700-preview.mp4",
    artiste:"SaiSai feat Boro700", titre:"Fin des temps", meta:"Clip · 2026" },
  { src:"videos/fulltrap-skinny-bastard-skinny-bastard-s-flow-type-shit-prev.mp4",     artiste:"FullTrap & Skinny Bastard", titre:"Skinny Bastard's Flow", meta:"Clip · 2026" },
  { src:"videos/video-intro.mp4", artiste:"BINKSFILMS", titre:"La porte",     meta:"Intro · boucle" }
];

var cv = document.getElementById("c");
var gl = cv.getContext("webgl", {antialias:false, alpha:false, powerPreference:"high-performance"});
var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

var VERT = "attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}";

var FRAG = [
"precision highp float;",
"varying vec2 uv;",
"uniform sampler2D A,B;",
"uniform vec2 rA,rB,res;",
"uniform float t, tir, temps;",

"vec2 cover(vec2 u, vec2 r){",
"  float ar = res.x/res.y, ai = r.x/r.y;",
"  vec2 s = ar > ai ? vec2(1.0, ai/ar) : vec2(ar/ai, 1.0);",
"  return (u-0.5)/s + 0.5;",
"}",
"float bruit(vec2 x){ return fract(sin(dot(x, vec2(12.9898,78.233)))*43758.5453); }",
"float lisse(vec2 x){",
"  vec2 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);",
"  return mix(mix(bruit(i),bruit(i+vec2(1.,0.)),f.x), mix(bruit(i+vec2(0.,1.)),bruit(i+vec2(1.,1.)),f.x), f.y);",
"}",
"float fbm(vec2 x){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*lisse(x); x*=2.03; a*=.5; } return s; }",
"float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }",

/* La déchirure : la matière est découpée en bandes horizontales dont
   chacune part avec un retard propre. Plus on tire fort, plus les
   bandes se décalent — et plus elles sont fines, comme une pellicule
   qui se fragmente au lieu de s'étirer. */
"vec2 arracher(vec2 u, float force){",
"  float n = 8.0 + force*34.0;",
"  float bande = floor(u.y * n);",
"  float retard = bruit(vec2(bande, 3.7));",
"  u.x += (retard - 0.5) * force * 0.34;",
"  u.y += force * 0.055 * (retard - 0.5);",
"  return u;",
"}",

"void main(){",
"  float f = min(tir, 1.0);",
"  vec2 ua = arracher(cover(uv, rA), f);",
"  vec2 ub = arracher(cover(uv, rB), f);",

"  vec3 a = texture2D(A, ua).rgb;",
"  vec3 b = texture2D(B, ub).rgb;",

/* le fondu s'ouvre par les hautes lumières du plan sortant */
"  float grain = fbm(uv*vec2(res.x/res.y,1.0)*3.2 + temps*0.05);",
"  float seuil = (1.0 - lum(a)) * 0.58 + grain * 0.26;",
"  float m = smoothstep(seuil - 0.13, seuil + 0.13, t*1.26 - 0.10);",
"  float bord = 1.0 - abs(m*2.0 - 1.0);",

/* Filé de mouvement : quatre prélèvements dans le sens du tirage.
   Coût nul à l'arrêt puisque l'écart est proportionnel à la force. */
"  float e = f * 0.030 + bord * 0.012;",
"  vec3 col = vec3(0.0);",
"  for(int k=0;k<4;k++){",
"    float d = (float(k)/3.0 - 0.5) * e;",
"    vec3 ca = texture2D(A, ua + vec2(0.0, d)).rgb;",
"    vec3 cb = texture2D(B, ub + vec2(0.0, d)).rgb;",
"    col += mix(ca, cb, m) * 0.25;",
"  }",

/* écart chromatique : la couche rouge et la bleue ne suivent pas le
   geste à la même vitesse */
"  float ec = f*0.011 + bord*0.008;",
"  col.r = mix(texture2D(A, ua+vec2(ec,0.0)).r, texture2D(B, ub+vec2(ec,0.0)).r, m);",
"  col.b = mix(texture2D(A, ua-vec2(ec,0.0)).b, texture2D(B, ub-vec2(ec,0.0)).b, m);",

/* la ligne de fonte chauffe — l'accent du site, rien d'inventé */
"  col += vec3(0.44,0.05,0.10) * pow(bord, 3.0) * 0.55;",
"  float d2 = distance(uv, vec2(0.5));",
"  col *= 1.0 - d2*d2*0.55;",
"  gl_FragColor = vec4(col, 1.0);",
"}"].join("\n");

function compiler(ty, src){
  var s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; }
  return s;
}

var prog, loc = {}, vids = [], texs = [], prets = [];

function initGL(){
  var vs = compiler(gl.VERTEX_SHADER, VERT), fs = compiler(gl.FRAGMENT_SHADER, FRAG);
  if(!vs || !fs) return false;
  prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); return false; }
  gl.useProgram(prog);
  /* WebGL remplit les textures de bas en haut alors qu'une image et une
     vidéo se lisent de haut en bas : sans cette ligne, tout est
     retourné. Posée une fois pour tout le contexte. */
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var p = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  ["A","B","rA","rB","res","t","tir","temps"].forEach(function(n){ loc[n] = gl.getUniformLocation(prog, n); });
  gl.uniform1i(loc.A, 0); gl.uniform1i(loc.B, 1);
  return true;
}

function creerTexture(){
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([10,10,10]));
  return t;
}

function preparer(){
  var hote = document.getElementById("videos");
  PLANS.forEach(function(pl, i){
    var v = document.createElement("video");
    v.src = pl.src; v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = "metadata"; v.crossOrigin = "anonymous";
    v.setAttribute("playsinline",""); v.setAttribute("muted","");
    v.addEventListener("loadeddata", function(){ prets[i] = true; });
    v.addEventListener("error", function(){ prets[i] = false; });
    hote.appendChild(v); vids[i] = v; texs[i] = creerTexture(); prets[i] = false;
  });
}

/* ---------- économie de décodage ----------
   Deux plans jouent au maximum : celui qu'on regarde et le suivant.
   Les autres sont mis en pause. C'est la règle média du site, tenue
   dans le prototype. */
function arbitrerLecture(i){
  for(var k = 0; k < vids.length; k++){
    var actif = (k === i || k === i+1);
    if(actif){ if(vids[k].paused) vids[k].play().catch(function(){}); }
    else if(!vids[k].paused) vids[k].pause();
  }
}

var position = 0, cible = 0, tir = 0, dernier = 0, dernierIndex = -1, demarre = false;
function N(){ return PLANS.length; }
function pousser(d){
  cible += d;
  if(cible < 0) cible = 0;
  if(cible > N()-1) cible = N()-1;
}
addEventListener("wheel", function(e){ pousser(e.deltaY * 0.0018); }, {passive:true});
var ty = null;
addEventListener("touchstart", function(e){ ty = e.touches[0].clientY; }, {passive:true});
addEventListener("touchmove", function(e){
  if(ty === null) return;
  var y = e.touches[0].clientY; pousser((ty - y) * 0.0055); ty = y;
}, {passive:true});
addEventListener("touchend", function(){ ty = null; }, {passive:true});
addEventListener("keydown", function(e){
  if(e.key==="ArrowDown"||e.key==="PageDown"||e.key===" ") pousser(1);
  if(e.key==="ArrowUp"||e.key==="PageUp") pousser(-1);
});

function cartel(i){
  var p = PLANS[i]; if(!p) return;
  document.getElementById("artiste").textContent = p.artiste;
  document.getElementById("titre").textContent = p.titre;
  document.getElementById("meta").textContent = p.meta;
  document.getElementById("bobine").textContent =
    String(i+1).padStart(2,"0") + " / " + String(N()).padStart(2,"0");
}

function redim(){
  var d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", redim);

function taille(i){
  var v = vids[i];
  return (v && v.videoWidth) ? [v.videoWidth, v.videoHeight] : [16, 9];
}
function poser(unite, i){
  gl.activeTexture(unite === 0 ? gl.TEXTURE0 : gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texs[i]);
  var v = vids[i];
  if(prets[i] && v.readyState >= 2){
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, v);
  }
}

function boucle(now){
  var dt = Math.min((now - dernier)/16.67, 3); dernier = now;
  var avant = position;
  position += (cible - position) * (reduced ? 1 : 0.062) * dt;
  /* le tirage est la vitesse instantanée : il monte avec le geste et
     redescend tout seul. À l'arrêt il vaut zéro, donc rien ne subsiste. */
  var brut = Math.abs(position - avant) * 26;
  tir = reduced ? 0 : Math.max(brut, tir * 0.90);

  var i = Math.max(0, Math.min(N()-2, Math.floor(position)));
  var t = Math.max(0, Math.min(1, position - i));
  var vu = t > 0.5 ? i+1 : i;
  if(vu !== dernierIndex){ dernierIndex = vu; cartel(vu); arbitrerLecture(i); }

  poser(0, i); poser(1, Math.min(i+1, N()-1));
  var ra = taille(i), rb = taille(Math.min(i+1, N()-1));
  gl.uniform2f(loc.rA, ra[0], ra[1]);
  gl.uniform2f(loc.rB, rb[0], rb[1]);
  gl.uniform2f(loc.res, cv.width, cv.height);
  gl.uniform1f(loc.t, t);
  gl.uniform1f(loc.tir, tir);
  gl.uniform1f(loc.temps, now * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(boucle);
}

/* ---------- repli ----------
   Sans WebGL ou sans shader, on retombe sur les mêmes plans empilés en
   plein écran, lus en boucle. Le concept perd sa matière, pas son
   propos, et rien ne reste vide. */
function repli(){
  cv.style.display = "none";
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;background:#0A0A0A";
  PLANS.forEach(function(p){
    var s = document.createElement("section");
    s.style.cssText = "height:100svh;scroll-snap-align:start;position:relative;overflow:hidden";
    var v = document.createElement("video");
    v.src = p.src; v.muted = true; v.loop = true; v.autoplay = true;
    v.setAttribute("playsinline","");
    v.style.cssText = "width:100%;height:100%;object-fit:cover";
    s.appendChild(v); d.appendChild(s);
  });
  document.body.appendChild(d);
  document.getElementById("porte").classList.add("off");
  document.getElementById("aide").classList.add("off");
}

document.getElementById("entrer").addEventListener("click", function(){
  document.getElementById("porte").classList.add("off");
  if(!gl || !initGL()) return repli();
  preparer();
  arbitrerLecture(0);
  cartel(0); redim();
  dernier = performance.now(); demarre = true;
  requestAnimationFrame(boucle);
  setTimeout(function(){ document.getElementById("aide").classList.add("off"); }, 5000);
});
</script>
</body>
</html>
